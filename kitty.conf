# kitty configuration
# Ported from ~/.dotfiles/.alacritty.toml
# Reference: https://sw.kovidgoyal.net/kitty/conf/

# Fonts
# MonoLisa Nerd Font Mono ships Bold/Italic/Bold Italic variants, so `auto`
# resolves them from the regular family (equivalent to alacritty's per-style
# family/style entries).
font_family      MonoLisa Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# kitty renders box-drawing/powerline glyphs with its own builtin drawing by
# default, matching alacritty's `builtin_box_drawing = true`. No directive needed.

# Primary colors
background #232627
foreground #fcfcfc

# Normal colors (color0-color7)
color0 #232627
color1 #ed1515
color2 #11d116
color3 #f67400
color4 #1d99f3
color5 #9b59b6
color6 #1abc9c
color7 #fcfcfc

# Bright colors (color8-color15)
color8  #7f8c8d
color9  #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff

# Note: alacritty's `colors.dim` palette and `dim_foreground`/`bright_foreground`
# have no direct kitty equivalent, so they are intentionally omitted.

# Selection: save selected text to the system clipboard
# (alacritty: selection.save_to_clipboard = true)
copy_on_select clipboard

# Shell: launch a login bash that runs the dotfiles startup script,
# mirroring alacritty's `terminal.shell` (program /bin/bash,
# args ["--login", "-c", "~/.dotfiles/single.sh"]).
shell /bin/bash --login -c ~/.dotfiles/single.sh

# Window: start in a normal (non-maximized/fullscreen) window, which is
# kitty's default and matches alacritty's `startup_mode = "Windowed"`.
remember_window_size yes
